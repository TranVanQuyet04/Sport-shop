name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish / ${{ matrix.image }}
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: frontend
            build_args: |
              VITE_API_URL=${{ vars.VITE_API_URL }}
              VITE_AUTH_API_URL=${{ vars.VITE_AUTH_API_URL }}
              VITE_CATALOG_API_URL=${{ vars.VITE_CATALOG_API_URL }}
              VITE_ORDER_API_URL=${{ vars.VITE_ORDER_API_URL }}
              VITE_CHAT_API_URL=${{ vars.VITE_CHAT_API_URL }}
              VITE_CHAT_WS_URL=${{ vars.VITE_CHAT_WS_URL }}
          - image: auth-service
            context: backend/auth-service
            build_args: ""
          - image: product-catalog-service
            context: backend/product-catalog-service
            build_args: ""
          - image: order-fulfillment-service
            context: backend/order-fulfillment-service
            build_args: ""
          - image: support-chat-service
            context: backend/support-chat-service
            build_args: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
