# ============================================
# SPRING BOOT APPLICATION - COMMON
# ============================================

spring.config.import=optional:file:auth-service/.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================
# SERVER
# ============================================

server.port=${SERVER_PORT}
server.shutdown=${SERVER_SHUTDOWN:graceful}
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:20s}

# ============================================
# JWT
# ============================================

jwt.secret-key=${JWT_SECRET_KEY}
jwt.blacklist.enabled=${JWT_BLACKLIST_ENABLED:false}

# ============================================
# OPENAPI / SWAGGER
# ============================================

open.api.title=${OPEN_API_TITLE:Sport Shop API}
open.api.version=${OPEN_API_VERSION:v1.0.0}
open.api.description=${OPEN_API_DESCRIPTION:Sport Shop backend service}
open.api.serverName=${OPEN_API_SERVER_NAME:Local Server}

# ============================================
# APPLICATION / CORS
# ============================================

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# ============================================
# MAIL
# ============================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}

# ============================================
# SEED ACCOUNT
# ============================================

seed.user.default-password=${SEED_USER_DEFAULT_PASSWORD:change-me}

seed.user.admin.full-name=${SEED_ADMIN_FULL_NAME:Admin User}
seed.user.admin.email=${SEED_ADMIN_EMAIL:admin@example.com}
seed.user.admin.phone=${SEED_ADMIN_PHONE:0123456789}

seed.user.shop-staff.full-name=${SEED_SHOP_STAFF_FULL_NAME:Shop Staff User}
seed.user.shop-staff.email=${SEED_SHOP_STAFF_EMAIL:staff@example.com}
seed.user.shop-staff.phone=${SEED_SHOP_STAFF_PHONE:0323456789}

seed.user.shipper.full-name=${SEED_SHIPPER_FULL_NAME:Shipper User}
seed.user.shipper.email=${SEED_SHIPPER_EMAIL:shipper@example.com}
seed.user.shipper.phone=${SEED_SHIPPER_PHONE:0333456789}

seed.user.member.full-name=${SEED_MEMBER_FULL_NAME:Member User}
seed.user.member.email=${SEED_MEMBER_EMAIL:member@example.com}
seed.user.member.phone=${SEED_MEMBER_PHONE:0987654321}

