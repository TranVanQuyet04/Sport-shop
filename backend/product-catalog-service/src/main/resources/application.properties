# ============================================
# SPRING BOOT APPLICATION - COMMON
# ============================================

spring.config.import=optional:file:./.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================
# SERVER
# ============================================

server.port=${SERVER_PORT}
server.shutdown=${SERVER_SHUTDOWN:graceful}
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:20s}

# ============================================
# JWT
# ============================================

jwt.secret-key=${JWT_SECRET_KEY}

# ============================================
# OPENAPI / SWAGGER
# ============================================

open.api.title=${OPEN_API_TITLE:Sport Shop API}
open.api.version=${OPEN_API_VERSION:v1.0.0}
open.api.description=${OPEN_API_DESCRIPTION:Sport Shop backend service}
open.api.serverName=${OPEN_API_SERVER_NAME:Local Server}

# ============================================
# APPLICATION / CORS
# ============================================

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# ============================================
# GEMINI
# ============================================

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:}
