# ============================================
# DOCKER PROFILE CONFIGURATION
# ============================================

# ============================================
# DATABASE - DOCKER
# ============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}

# ============================================
# REDIS - DOCKER
# ============================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# ============================================
# JPA / HIBERNATE - DOCKER
# ============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM}

# ============================================
# LOGGING - DOCKER
# ============================================
logging.level.root=${LOGGING_LEVEL_ROOT}
logging.level.com.t.e=${LOGGING_LEVEL_APP}
logging.pattern.console=${LOGGING_PATTERN_CONSOLE}

# ============================================
# OPENAPI - DOCKER
# ============================================
open.api.serverName=${OPEN_API_SERVER_NAME}

# ============================================
# APPLICATION - DOCKER
# ============================================
app.frontend.url=${APP_FRONTEND_URL}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

server.port=${SERVER_PORT}

# ============================================
# INFO
# ============================================
info.app.name=${INFO_APP_NAME}
info.app.description=${INFO_APP_DESCRIPTION}
info.app.version=${INFO_APP_VERSION}
