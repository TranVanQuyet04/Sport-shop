# ============================================
# SPRING BOOT APPLICATION - COMMON CONFIGURATION
# ============================================
spring.application.name=${SPRING_APPLICATION_NAME}
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# ============================================
# SERVER
# ============================================
server.port=${SERVER_PORT}
server.shutdown=${SERVER_SHUTDOWN}
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE}

# ============================================
# JWT
# ============================================
jwt.secret-key=${JWT_SECRET_KEY}

# ============================================
# OPENAPI / SWAGGER
# ============================================
open.api.title=${OPEN_API_TITLE}
open.api.version=${OPEN_API_VERSION}
open.api.description=${OPEN_API_DESCRIPTION}
open.api.serverName=${OPEN_API_SERVER_NAME}

# ============================================
# APPLICATION
# ============================================
app.frontend.url=${APP_FRONTEND_URL}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

# ============================================
# MAIL
# ============================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE}

# ============================================
# SEED ACCOUNT
# ============================================
seed.user.default-password=${SEED_USER_DEFAULT_PASSWORD}

seed.user.admin.full-name=${SEED_ADMIN_FULL_NAME}
seed.user.admin.email=${SEED_ADMIN_EMAIL}
seed.user.admin.phone=${SEED_ADMIN_PHONE}

seed.user.shop-staff.full-name=${SEED_SHOP_STAFF_FULL_NAME}
seed.user.shop-staff.email=${SEED_SHOP_STAFF_EMAIL}
seed.user.shop-staff.phone=${SEED_SHOP_STAFF_PHONE}

seed.user.shipper.full-name=${SEED_SHIPPER_FULL_NAME}
seed.user.shipper.email=${SEED_SHIPPER_EMAIL}
seed.user.shipper.phone=${SEED_SHIPPER_PHONE}

seed.user.member.full-name=${SEED_MEMBER_FULL_NAME}
seed.user.member.email=${SEED_MEMBER_EMAIL}
seed.user.member.phone=${SEED_MEMBER_PHONE}

# ============================================
# VNPAY
# ============================================
vnpay.url=${VNPAY_URL}
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.returnUrl=${VNPAY_RETURN_URL}
vnpay.version=${VNPAY_VERSION}
vnpay.command=${VNPAY_COMMAND}

# ============================================
# GEMINI
# ============================================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}
