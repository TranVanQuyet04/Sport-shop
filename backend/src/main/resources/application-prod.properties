# ============================================
# PRODUCTION PROFILE CONFIGURATION
# ============================================

# ============================================
# DATABASE - PROD
# ============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.hikari.pool-name=${SPRING_DATASOURCE_HIKARI_POOL_NAME}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME}

# ============================================
# REDIS - PROD
# ============================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# ============================================
# JPA / HIBERNATE - PROD
# ============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM}

# ============================================
# LOGGING - PROD
# ============================================
logging.level.root=${LOGGING_LEVEL_ROOT}
logging.level.com.t.e=${LOGGING_LEVEL_APP}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE_SQL}

logging.file.name=${LOG_FILE_PATH}
logging.file.max-size=${LOG_FILE_MAX_SIZE}
logging.file.max-history=${LOG_FILE_MAX_HISTORY}

# ============================================
# OPENAPI - PROD
# ============================================
open.api.serverName=${OPEN_API_SERVER_NAME}

# ============================================
# APPLICATION - PROD
# ============================================
app.frontend.url=${APP_FRONTEND_URL}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

server.port=${SERVER_PORT}
