services:
  redis:
    image: redis:7-alpine
    container_name: sportshop-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: sportshop-auth-service
    env_file:
      - ./auth-service/.env
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  product-catalog-service:
    build:
      context: ./product-catalog-service
      dockerfile: Dockerfile
    container_name: sportshop-product-catalog-service
    env_file:
      - ./product-catalog-service/.env
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  order-fulfillment-service:
    build:
      context: ./order-fulfillment-service
      dockerfile: Dockerfile
    container_name: sportshop-order-fulfillment-service
    env_file:
      - ./order-fulfillment-service/.env
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth-service:
        condition: service_started
      product-catalog-service:
        condition: service_started
    restart: unless-stopped

  support-chat-service:
    build:
      context: ./support-chat-service
      dockerfile: Dockerfile
    container_name: sportshop-support-chat-service
    env_file:
      - ./support-chat-service/.env
    ports:
      - "8084:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
