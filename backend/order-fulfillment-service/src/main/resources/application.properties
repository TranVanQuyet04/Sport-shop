# ============================================
# SPRING BOOT APPLICATION - COMMON
# ============================================

spring.config.import=optional:file:order-fulfillment-service/.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================
# SERVER
# ============================================

server.port=${SERVER_PORT}
server.shutdown=${SERVER_SHUTDOWN:graceful}
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:20s}

services.auth.base-url=${AUTH_SERVICE_URL:http://localhost:8081}
services.product-catalog.base-url=${PRODUCT_CATALOG_SERVICE_URL:http://localhost:8082}

# ============================================
# JWT
# ============================================

jwt.secret-key=${JWT_SECRET_KEY}

# ============================================
# OPENAPI / SWAGGER
# ============================================

open.api.title=${OPEN_API_TITLE:Sport Shop API}
open.api.version=${OPEN_API_VERSION:v1.0.0}
open.api.description=${OPEN_API_DESCRIPTION:Sport Shop backend service}
open.api.serverName=${OPEN_API_SERVER_NAME:Local Server}

# ============================================
# APPLICATION / CORS
# ============================================

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# ============================================
# VNPAY
# ============================================

vnpay.url=${VNPAY_URL:}
vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.returnUrl=${VNPAY_RETURN_URL:}
vnpay.version=${VNPAY_VERSION:2.1.0}
vnpay.command=${VNPAY_COMMAND:pay}

