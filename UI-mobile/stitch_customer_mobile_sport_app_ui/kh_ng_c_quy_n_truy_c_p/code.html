    body {

<body class="bg-background text-on-background min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface dark:bg-background shadow-sm">
<button class="flex items-center justify-center w-10 h-10 active:bg-surface-container-low dark:active:bg-surface-container-highest transition-colors active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary dark:text-on-background">arrow_back</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-black italic tracking-tighter text-primary dark:text-on-background">APEX VELOCITY</span>
<button class="flex items-center justify-center w-10 h-10 active:bg-surface-container-low dark:active:bg-surface-container-highest transition-colors active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary dark:text-on-background">shopping_cart</span>
</button>
</header>
<!-- Main Content: Unauthorized Screen -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-24 pb-12 bento-pattern">
<!-- Illustration Container -->
<div class="relative w-full max-w-[280px] aspect-square flex items-center justify-center mb-section-gap">
<!-- Decorative background elements for high-end feel -->
<div class="absolute inset-0 bg-secondary/5 rounded-full blur-3xl"></div>
<div class="absolute top-0 right-0 w-24 h-24 bg-tertiary/5 rounded-full animate-pulse"></div>
<!-- Graphic Element -->
<div class="relative flex flex-col items-center">
<div class="w-32 h-32 md:w-40 md:h-40 bg-white rounded-3xl shadow-xl flex items-center justify-center border border-outline-variant/30 overflow-hidden">
<img alt="Access Denied Illustration" class="w-full h-full object-cover" data-alt="A professional 3D isometric illustration of a sleek black security vault with a glowing red digital lock. The setting is a clean, minimalist high-tech environment with soft grey shadows. The lighting is focused and dramatic, emphasizing the metallic textures and the vibrant red warning light. The overall mood is serious, secure, and modern, following a strict monochrome palette with bold red accents." src="https://lh3.googleusercontent.com/aida/AP1WRLsdrbT4Inb_-YxTH1_JDoOiTduNc1R3kpyl4vY7wergWXK-YNrWFco_TvPEqvpIXXiuWtbGTd-4YGz7T5L5OUGX90QtjV3MHTeDd8wfkn_XCAyXdR8go_D_WMANJTc2w_Y4S1VJvexCRqHXOQ2yDvJlcuV6299-FEmRq1ZVYXMu0alULv-UCzOi5pgmoO5l4GAO3FbZw28vvM64Xquvn_hpc1jw7bDUZG2lgw7h4cqMfueFBMVDbdI_mQ"/>
<div class="absolute inset-0 flex items-center justify-center bg-secondary/10">
<span class="material-symbols-outlined text-[80px] text-secondary" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
</div>
<!-- 403 Badge -->
<div class="mt-6 px-4 py-1 bg-primary text-white font-black italic text-xl tracking-widest skew-x-[-12deg]">
                    CODE: 403
                </div>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-4 max-w-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase tracking-tight">
                Không có quyền truy cập
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
                Bạn không có quyền xem nội dung này. Vui lòng đăng nhập bằng tài khoản phù hợp để tiếp tục khám phá các sản phẩm hiệu suất cao.
            </p>
</div>
<!-- Actions -->
<div class="w-full max-w-sm mt-section-gap flex flex-col gap-4">
<button class="w-full h-14 bg-secondary text-white font-button text-button rounded-lg shadow-lg active:scale-95 transition-transform duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">login</span>
                ĐĂNG NHẬP
            </button>
<button class="w-full h-14 border-2 border-primary bg-transparent text-primary font-button text-button rounded-lg active:bg-surface-container-low transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">home</span>
                QUAY LẠI TRANG CHỦ
            </button>
</div>
<!-- Secondary Help Link -->
<button class="mt-8 text-on-surface-variant font-label-bold text-label-bold underline underline-offset-4 active:opacity-60 transition-opacity">
            Liên hệ hỗ trợ kỹ thuật
        </button>
</main>
<!-- Footer Space to account for fixed nav -->
<div class="h-16"></div>
<!-- BottomNavBar (Suppressed based on Transactional/Task-Focused Rule, but included for Shell Integrity if required - typically 403 is a "Dead End" so I will keep it hidden as per instructions but I'll add the shell logic for completeness if user navigates back) -->
<!-- Instruction says suppress if task focused or dead end. 403 is a dead end. I will omit the BottomNavBar to prioritize focus. -->
<script>
        // Micro-interactions
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.style.opacity = '0.8';
            });
            button.addEventListener('touchend', function() {
                this.style.opacity = '1';
            });
        });

        // Simple enter animation
        window.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            main.style.opacity = '0';
            main.style.transform = 'translateY(10px)';
            main.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
            
            setTimeout(() => {
                main.style.opacity = '1';
                main.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
