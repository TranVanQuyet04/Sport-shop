<!-- BottomNavBar (Suppressed for 404 as per Destination Rule, but included as a shell structure for context if user navigates back) -->

<div class="fixed bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-2 text-on-surface-variant/60">
<span class="font-label-bold text-label-bold tracking-widest uppercase">Apex Velocity • Performance Gear</span>

<script>
        // Simple touch feedback for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.classList.add('opacity-80');
            });
            button.addEventListener('touchend', function() {
                this.classList.remove('opacity-80');
            });
        });

        // Small parallax effect for the "404" graphic on device tilt (if supported)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (event) => {
                const tiltX = event.gamma / 10;
                const tiltY = event.beta / 10;
                const graphic = document.querySelector('.relative.z-10');
                if(graphic) {
                    graphic.style.transform = `translate(${tiltX}px, ${tiltY}px)`;
                }
            });
        }
    </script>
