</div>

<span class="material-symbols-outlined text-[14px] text-on-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="text-label-bold font-label-bold text-on-primary">QUẢN TRỊ VIÊN CAO CẤP</span>
</div>
</div>
</section>
<!-- Menu List -->
<section class="space-y-4">

<!-- Item: Personal Info -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container transition-colors active:bg-surface-container-high text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined">person</span>
</div>
<span class="font-button text-button">Thông tin cá nhân</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Item: Change Password -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container transition-colors active:bg-surface-container-high text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined">lock</span>
</div>

</div>

</div>

</button>
<!-- Item: Language -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container transition-colors active:bg-surface-container-high text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined">language</span>
</div>

<span class="material-symbols-outlined">dashboard</span>
<span class="text-label-bold font-label-bold">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="text-label-bold font-label-bold">Catalog</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">shopping_cart</span>
<span class="text-label-bold font-label-bold">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">groups</span>
<span class="text-label-bold font-label-bold">Staff</span>
</a>
<!-- Active Tab: Settings (Thiết lập Admin) -->
<a class="flex flex-col items-center justify-center text-secondary font-bold active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="text-label-bold font-label-bold">Settings</span>
</a>

<script>
        // Simple micro-interaction for menu items
        document.querySelectorAll('button.w-full').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.opacity = '0.7';
            });
            btn.addEventListener('touchend', () => {
                btn.style.opacity = '1';
            });
        });
    </script>
</body></html>
