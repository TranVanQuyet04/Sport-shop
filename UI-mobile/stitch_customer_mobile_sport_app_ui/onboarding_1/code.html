<!DOCTYPE html>

<html class="light" lang="vi"><head>

      }

<style>
        body {
            background-color: #f9f9f9;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-scale:active {
            transform: scale(0.95);
        }
        .image-gradient-overlay {
            background: linear-gradient(0deg, rgba(249,249,249,1) 10%, rgba(249,249,249,0.4) 40%, rgba(249,249,249,0) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- Header / Top Bar (Manual handling as per Onboarding Suppress rule) -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-end px-margin-mobile pt-8">
<button class="font-button text-button text-on-surface-variant hover:text-primary transition-colors active-scale">
            Bỏ qua
        </button>
</header>
<main class="flex-grow flex flex-col items-center">
<!-- Hero Image Section with Asymmetric Layout Hint -->
<div class="relative w-full h-[530px] overflow-hidden">
<img alt="Runner athlete" class="w-full h-full object-cover grayscale contrast-125" data-alt="A powerful professional male athlete in mid-stride during a high-speed sprint on a dark urban track. The lighting is dramatic and high-contrast, casting deep shadows while highlighting the sleek textures of his black performance gear. The overall aesthetic is minimalist and intense, using a monochromatic palette of blacks and cool grays with a sharp, modern professional look. The mood is urgent and focused, embodying elite athletic discipline." src="https://lh3.googleusercontent.com/aida/AP1WRLtuf4N1r0NF4KeJ1iJ7Oi703xVx1_vyRVC-kFOBF3sN4tb5zwNmwfPKR8W-TpC2gXM6Gq4D0k9obeMK0mLdU3Bl-LKESb2Y75_97jaYs3qsbEGCzYlJFeekmWlPssRC8TeEJIa0NsRIKMq2stR0qZHTtLMIhZQeMBWEdpBXxsXgraR9ljBIVT-CFHznmfvBsFy4po2sdzcD6LCPgcuRxi0JUVBbpPEXxfFqh9NgVZXI16SX1JJSc4dCOg"/>
<div class="absolute inset-0 image-gradient-overlay"></div>
<!-- Floating Decorative Element (Brand Identity) -->
<div class="absolute bottom-12 left-margin-mobile">
<div class="bg-secondary px-4 py-1 text-on-secondary font-black tracking-widest text-[10px] uppercase">
                    PERFORMANCE ELITE
                </div>
</div>
</div>
<!-- Content Canvas -->
<div class="w-full px-margin-mobile -mt-8 relative z-10 flex flex-col items-center text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-4 tracking-tighter">
                Trải nghiệm thể thao <br/> đỉnh cao
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-section-gap max-w-[320px]">
                Khám phá bộ sưu tập đồ thể thao mới nhất từ các thương hiệu hàng đầu thế giới.
            </p>
<!-- Page Indicators -->
<div class="flex gap-2 mb-section-gap">
<div class="h-1.5 w-8 rounded-full bg-secondary"></div>
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant"></div>
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant"></div>
</div>
</div>
</main>
<!-- Bottom Actions Container (Thumb Zone Optimized) -->
<footer class="p-margin-mobile pb-12 w-full max-w-md mx-auto">
<button class="w-full h-touch-target-min bg-secondary text-on-secondary font-button text-button rounded-xl shadow-lg shadow-secondary/20 active-scale transition-all hover:brightness-110 flex items-center justify-center gap-2">
            Tiếp tục
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</footer>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.querySelector('button');
            btn.addEventListener('touchstart', () => {
                btn.classList.add('scale-95');
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
