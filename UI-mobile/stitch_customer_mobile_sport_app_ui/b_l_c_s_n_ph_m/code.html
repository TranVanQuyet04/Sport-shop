<script>
        const openBtn = document.getElementById('open-filter');
        const backdrop = document.getElementById('modal-backdrop');
        const sheet = document.getElementById('filter-sheet');
        const applyBtn = document.getElementById('apply-btn');

        function toggleModal(show) {
            if (show) {
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
                backdrop.classList.add('opacity-100');
                sheet.classList.remove('translate-y-full');
                document.body.style.overflow = 'hidden';
            } else {
                backdrop.classList.add('opacity-0', 'pointer-events-none');
                backdrop.classList.remove('opacity-100');
                sheet.classList.add('translate-y-full');
                document.body.style.overflow = '';
            }
        }

        openBtn.addEventListener('click', () => toggleModal(true));
        backdrop.addEventListener('click', () => toggleModal(false));
        applyBtn.addEventListener('click', () => {
            // Simulate loading
            applyBtn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span>';
            setTimeout(() => {
                applyBtn.innerHTML = '<span>Áp dụng</span>';
                toggleModal(false);
            }, 600);
        });

        // Swipe down to close simulation
        let startY = 0;
        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        sheet.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            const deltaY = currentY - startY;
            if (deltaY > 0 && sheet.scrollTop <= 0) {
                sheet.style.transform = `translateY(${deltaY}px)`;
            }
        });

        sheet.addEventListener('touchend', (e) => {
            const currentY = e.changedTouches[0].clientY;
            const deltaY = currentY - startY;
            sheet.style.transform = '';
            if (deltaY > 150) {
                toggleModal(false);
            }
        });

        // Toggle chip states
        const chips = document.querySelectorAll('button:not(#open-filter):not(#apply-btn):not(#reset-btn)');
        chips.forEach(chip => {
            if(!chip.classList.contains('w-10')) { // Exclude color dots
                chip.addEventListener('click', () => {
                    const siblings = chip.parentElement.children;
                    for (let sibling of siblings) {
                        sibling.classList.remove('active-chip');
                        sibling.classList.add('bg-surface-container-low');
                    }
                    chip.classList.remove('bg-surface-container-low');
                    chip.classList.add('active-chip');
                });
            }
        });

        // Auto open on load for presentation
        setTimeout(() => toggleModal(true), 800);
    </script>
