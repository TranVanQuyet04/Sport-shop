<script>
        const slider = document.getElementById('gallery-slider');
        const indicator = document.getElementById('page-indicator');
        const dots = document.querySelectorAll('.nav-dot');
        const totalSlides = 5;

        slider.addEventListener('scroll', () => {
            const index = Math.round(slider.scrollLeft / window.innerWidth);
            
            // Update Page Number
            indicator.textContent = `${index + 1} / ${totalSlides}`;
            
            // Update Dots
            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.remove('w-2', 'bg-white/30');
                    dot.classList.add('w-8', 'bg-white');
                } else {
                    dot.classList.add('w-2', 'bg-white/30');
                    dot.classList.remove('w-8', 'bg-white');
                }
            });
        });

        // Touch Interaction: Pinch to zoom concept (visual only)
        let lastScale = 1;
        const images = document.querySelectorAll('.product-image');
        
        images.forEach(img => {
            img.addEventListener('dblclick', () => {
                if (lastScale === 1) {
                    img.style.transform = 'scale(1.5)';
                    lastScale = 1.5;
                } else {
                    img.style.transform = 'scale(1)';
                    lastScale = 1;
                }
            });
        });
    </script>
