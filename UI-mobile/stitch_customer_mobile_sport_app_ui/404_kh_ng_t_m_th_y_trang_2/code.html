<script>
        // Micro-interaction for the floating shoe
        const shoe = document.querySelector('.animate-float');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            shoe.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset transform when mouse leaves
        document.addEventListener('mouseleave', () => {
            shoe.style.transform = `rotateY(0deg) rotateX(0deg)`;
            shoe.style.transition = 'all 0.5s ease';
        });

        document.addEventListener('mouseenter', () => {
            shoe.style.transition = 'none';
        });
    </script>
