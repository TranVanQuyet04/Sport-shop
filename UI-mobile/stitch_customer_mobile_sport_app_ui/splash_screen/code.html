<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .loading-shimmer {
            position: relative;
            overflow: hidden;
        }
        .loading-shimmer::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(227, 24, 55, 0.2), transparent);
            animation: shimmer 1.5s infinite;
        }
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed": "#410007",
                      "primary-container": "#1b1b1b",
                      "outline-variant": "#cfc4c5",
                      "on-tertiary-fixed": "#1a1c1c",
                      "on-secondary-fixed-variant": "#92001d",
                      "surface-container-highest": "#e2e2e2",
                      "on-secondary": "#ffffff",
                      "on-tertiary-fixed-variant": "#454747",
                      "inverse-on-surface": "#f1f1f1",
                      "surface-dim": "#dadada",

                      "primary-fixed": "#e2e2e2",
                      "on-error": "#ffffff",
                      "surface-bright": "#f9f9f9",
                      "error": "#ba1a1a",
                      "secondary-container": "#e51a38",
                      "outline": "#7e7576",
                      "inverse-primary": "#c6c6c6",
                      "error-container": "#ffdad6",
                      "on-surface-variant": "#4c4546",
                      "inverse-surface": "#2f3131",
                      "tertiary-fixed-dim": "#c6c6c7",
                      "surface": "#f9f9f9",
                      "on-primary-fixed-variant": "#474747",
                      "secondary": "#bb0027",

                      "on-tertiary": "#ffffff",
                      "on-tertiary-container": "#838484",

                      "on-primary-container": "#848484",
                      "surface-container": "#eeeeee",
                      "on-primary": "#ffffff",
                      "on-surface": "#1a1c1c",
                      "on-error-container": "#93000a",
                      "on-background": "#1a1c1c"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"

              "spacing": {
                      "gutter-mobile": "12px",
                      "section-gap": "32px",

              "fontFamily": {

<body class="bg-surface-container-lowest text-on-surface font-body-lg flex flex-col items-center justify-center min-h-screen overflow-hidden">
<!-- Splash Content Wrapper -->
<main class="relative flex flex-col items-center justify-center w-full max-w-md h-full px-margin-mobile">
<!-- Logo Section -->
<div class="fade-in-up flex flex-col items-center justify-center mb-12">
<div class="relative w-48 h-48 md:w-64 md:h-64 transition-transform duration-700 hover:scale-105">
<img alt="SPORTSHOP Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLuYrUHUrCOcm_bwS1gch8UTf4za8SO45smYdHjduq1BBuFLsuRAvtwv0l_JT1HxvjgsxIaM4NaE8wcJOu2yFykbmYMcVV3HXkGQyMpis2eZTbVyblNMuMg1l72TI7vVn2mosYKNABTpQdR0O1LAFEqYHwidZMMQimUq_SyHQccY6H7IS4x4hXKJcZGbtEDn_CMAvvLb8ytclj-IzZVpqvcEQRE0-zflN17B23ba7PnBJCIShQPWPffdfjU"/>
</div>
</div>
<!-- Footer Info Section (Sticky at bottom-ish) -->
<div class="absolute bottom-20 flex flex-col items-center space-y-6 fade-in-up" style="animation-delay: 0.2s;">
<!-- Loading Indicator -->
<div class="w-12 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-secondary-container w-1/3 rounded-full loading-shimmer"></div>
</div>
<!-- Tagline -->
<div class="flex flex-col items-center">
<span class="font-label-bold text-label-bold text-primary tracking-[0.2em] uppercase mb-1">
                    SPORTSWEAR
                </span>
<p class="font-button text-button text-on-surface-variant font-bold">
                    Sẵn sàng bứt phá
                </p>
</div>
</div>
<!-- Atmospheric Elements -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<!-- Subtle Radial Gradient for Depth -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[150%] bg-[radial-gradient(circle,rgba(227,24,55,0.03)_0%,transparent_70%)] opacity-50"></div>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulate a transition to another screen after delay
            setTimeout(() => {
                const main = document.querySelector('main');
                main.classList.add('transition-opacity', 'duration-1000', 'opacity-0');
            }, 3000);
            
            // Interaction: Pulse effect on logo
            const logoContainer = document.querySelector('.fade-in-up');
            if(logoContainer) {
                logoContainer.classList.add('animate-pulse');
                setTimeout(() => logoContainer.classList.remove('animate-pulse'), 1500);
            }
        });
    </script>
</body></html>
