<!-- JavaScript for interactions -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
                passwordIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
                passwordIcon.setAttribute('data-icon', 'visibility');
            }
        }

        // Simple form interaction simulation
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalContent;
                // Show error message again for demo purposes
                const errorMsg = document.getElementById('errorMessage');
                errorMsg.classList.remove('hidden');
                errorMsg.classList.add('error-shake');
                setTimeout(() => errorMsg.classList.remove('error-shake'), 400);
            }, 1500);
        });
    </script>
